name: legal-folonto

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: legal
      POSTGRES_DB: legal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        format: raw
    environment:
      DATABASE_URL: postgresql+asyncpg://legal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/legal
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      HF_HOME: /app/var/model-cache
      AWS_EC2_METADATA_DISABLED: "true"
      OMP_NUM_THREADS: "2"
    tmpfs:
      - /tmp:mode=1777,size=512m
    volumes:
      - model-cache:/app/var/model-cache

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "127.0.0.1:3100:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=128m

volumes:
  pgdata:
  model-cache:
